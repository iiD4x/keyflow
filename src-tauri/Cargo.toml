[package]
name = "keyflow"
version = "0.2.3"
description = "KeyFlow - FastKeys-style text expander with a Ctrl+Space palette"
authors = ["KeyFlow contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
