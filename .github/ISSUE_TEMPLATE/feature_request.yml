name: Feature request
description: Suggest a behavior or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task, not only the feature, so the smallest useful solution is easier to find
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
    validations:
      required: false
  - type: input
    id: today
    attributes:
      label: How do you handle it today
      description: Another tool, a workaround, or nothing
    validations:
      required: false
